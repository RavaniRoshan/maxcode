<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 16 18" width="420" height="473" role="img" aria-labelledby="t">
  <title id="t">Max, the maxcode mascot</title>
  <style>
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .tick { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.4px); } }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .eye, .tick, .glow { animation: none; } }
  </style>
  <defs>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BEE6FF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#BEE6FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#BEE6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle class="glow" cx="6" cy="8" r="8" fill="url(#glow-grad)"/>
  <g shape-rendering="crispEdges">
    <rect x="1" y="3" width="10" height="9" fill="#D9DEE5"/>
    <rect x="1" y="3" width="10" height="1" fill="#FFFFFF"/>
    <rect x="10" y="4" width="1" height="8" fill="#AEB6C2"/>
    <rect x="1" y="11" width="10" height="1" fill="#AEB6C2"/>
    <rect x="2" y="12" width="2" height="1" fill="#8D99AB"/>
    <rect x="8" y="12" width="2" height="1" fill="#8D99AB"/>
    <rect class="eye" x="3" y="5" width="1" height="2" fill="#0A0F1E"/>
    <rect class="eye" x="8" y="5" width="1" height="2" fill="#0A0F1E"/>
    <rect x="4" y="8" width="1" height="1" fill="#0A0F1E"/>
    <rect x="7" y="8" width="1" height="1" fill="#0A0F1E"/>
    <rect x="5" y="9" width="2" height="1" fill="#0A0F1E"/>
    <g class="tick" fill="#FFFFFF"><rect x="8" y="-1" width="1" height="1"/><rect x="9" y="-1" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="7" y="0" width="1" height="1"/><rect x="8" y="0" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/></g>
  </g>
</svg>
